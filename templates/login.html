<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Materials · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0a0e17; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    background-image: linear-gradient(rgba(79,195,247,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(79,195,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px; }
  .login-box { position: relative; background: #111827; border: 1px solid #1e2d45; border-radius: 20px; padding: 48px 40px; width: 400px; text-align: center; box-shadow: 0 0 60px rgba(79,195,247,0.08); }
  .login-box .icon { font-size: 3rem; margin-bottom: 16px; }
  .login-box h1 { font-size: 1.5rem; color: #4fc3f7; margin-bottom: 6px; }
  .login-box p { color: #78909c; font-size: .85rem; margin-bottom: 28px; }
  .login-box input { width: 100%; padding: 14px 18px; background: #1a2235; border: 1px solid #1e2d45; border-radius: 10px; color: #e0e6ed; font-size: 1rem; text-align: center; font-family: inherit; letter-spacing: 2px; }
  .login-box input:focus { outline: none; border-color: #4fc3f7; box-shadow: 0 0 16px rgba(79,195,247,0.1); }
  .login-box button { width: 100%; padding: 14px; margin-top: 16px; background: linear-gradient(135deg, #4fc3f7, #039be5); color: #000; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
  .login-box button:hover { box-shadow: 0 8px 24px rgba(79,195,247,0.25); }
  .error { color: #ef5350; font-size: .85rem; margin-top: 12px; }
  .hint { color: #455a64; font-size: .75rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="login-box">
  <div class="icon">🔬</div>
  <h1>Advanced Materials</h1>
  <p>Material Lab AI Platform</p>
  <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(79,195,247,0.1);">
    <div style="color:#4fc3f7;font-size:.75rem;font-weight:600;">华中科技大学</div>
    <div style="color:#78909c;font-size:.65rem;">材料科学与工程学院</div>
  </div>
  <form method="POST">
    <input type="password" name="key" placeholder="请输入访问密钥" autofocus>
    <button type="submit">🔑 进入平台</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="hint">受密钥保护的实验平台 · 仅供授权用户访问</div>
</div>
</body>
</html>
